name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nginx_ref:
        description: nginx-ext branch, tag or commit
        default: '1.31.8'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'HanadaLee/ngx_expr_module'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [nginx, nginx-ext]
    steps:
      - name: Check out module
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out nginx
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.source == 'nginx' && 'nginx/nginx' || 'HanadaLee/nginx-ext' }}
          ref: ${{ matrix.source == 'nginx' && 'release-1.31.8' || inputs.nginx_ref || '1.31.8' }}
          path: .ci/nginx
          persist-credentials: false

      - name: Check out nginx-tests
        uses: actions/checkout@v6
        with:
          repository: nginx/nginx-tests
          path: .ci/nginx-tests
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpcre2-dev \
            libssl-dev \
            zlib1g-dev \
            perl \
            pkg-config

      - name: Build and test
        env:
          TEST_EXPR: enabled
        run: bash util/run-tests.sh

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.source }}
          path: |
            .ci/test-output/**/*.log
            .ci/test-output/run.log
            t/servroot/logs/
            servroot/logs/
          if-no-files-found: ignore
